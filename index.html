<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Меню кафе</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #FFF8F0;
            --card-bg: #FFFFFF;
            --text-main: #3E2723;
            --text-muted: #8D6E63;
            --accent: #E64A19;
            --accent-light: #FFF3E0;
            --discount-red: #D32F2F;
            --border-color: #F0E5D8;
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0 16px 16px 16px;
            padding-bottom: calc(100px + var(--safe-bottom));
        }

        .header {
            text-align: center;
            padding: 20px 0 16px 0;
            background-color: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 4px 0;
            color: var(--accent);
        }

        .header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        .nav-scroll {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding-bottom: 12px;
            scrollbar-width: none;
        }
        .nav-scroll::-webkit-scrollbar { display: none; }

        .nav-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 4px 10px rgba(230, 74, 25, 0.2);
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 8px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1.5px solid var(--border-color);
            box-shadow: 0 6px 16px rgba(62, 39, 35, 0.06);
            opacity: 0;
            transform: translateY(15px);
            animation: cardAppear 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .card:active { transform: scale(0.98); background: #FDFDFD; }

        .card-img {
            width: 80px;
            height: 80px;
            border-radius: 14px;
            object-fit: cover;
            background-color: #eee;
            border: 1px solid var(--border-color);
        }

        .card-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .card-title { font-weight: 700; font-size: 16px; margin-bottom: 4px; color: var(--text-main); }
        .card-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; line-height: 1.3; }
        
        .price-container { display: flex; align-items: baseline; gap: 8px; }
        .card-price { font-weight: 800; font-size: 16px; color: var(--accent); }
        .card-price.discounted { color: var(--discount-red); }
        .old-price { font-size: 12px; color: #A0A0A0; text-decoration: line-through; font-weight: 600; }

        .add-btn {
            background-color: var(--accent-light);
            color: var(--accent);
            border: none;
            border-radius: 50%;
            width: 46px;
            height: 46px;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .add-btn:active { background-color: var(--accent); color: white; transform: scale(0.9); }

        .bottom-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 16px 20px calc(16px + var(--safe-bottom)) 20px;
            box-shadow: 0 -4px 20px rgba(62, 39, 35, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            border-top: 1px solid var(--border-color);
            z-index: 100;
        }

        .total-info { display: flex; flex-direction: column; }
        .total-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .total-price { font-weight: 800; font-size: 22px; color: var(--text-main); }

        .checkout-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(230, 74, 25, 0.3);
            transition: transform 0.1s;
        }
        .checkout-btn:active { transform: scale(0.95); }
        .checkout-btn:disabled { background-color: #ccc; box-shadow: none; }

        @keyframes cardAppear { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="header">
        <h1>Меню 🍔</h1>
        <p>Соберите свой идеальный заказ</p>
    </div>

    <div class="nav-scroll" id="nav-container"></div>
    <div class="menu-grid" id="menu-container"></div>

    <div class="bottom-bar">
        <div class="total-info">
            <span class="total-label">Итого:</span>
            <div class="total-price"><span id="total">0</span> сум</div>
        </div>
        <button class="checkout-btn" id="checkout-btn" onclick="sendOrder()">Оформить</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        // ==========================================
        // ТВОИ КАРТИНКИ С GITHUB
        // ⚠️ Убедись, что названия файлов совпадают 1 в 1 (и что есть .jpg в конце)
        // ==========================================
        const IMG_LAVASH = "lavash.jpg"; 
        const IMG_FRIES = "french_fries.jpg";
        const IMG_FUSETEA = "fusetea.jpg";
        const IMG_LIPTON = "lipton.jpg";
        const IMG_FRIENDS_ALWAYS = "friends_always.jpg";

        const products = [
            // Бургеры (пока с временными картинками)
            { id: 1, cat: "burgers", name: "Классик Бургер", price: 24000, desc: "Сочная котлета и свежие овощи", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=200" },
            { id: 2, cat: "burgers", name: "Чизбургер", price: 28000, desc: "Двойной сыр чеддер", img: "https://images.unsplash.com/photo-1550547660-d9450f859349?q=80&w=200" },
            { id: 3, cat: "burgers", name: "Двойной Чизбургер", price: 38000, desc: "Для очень голодных", img: "https://images.unsplash.com/photo-1586816001966-79b736744398?q=80&w=200" },
            { id: 4, cat: "burgers", name: "Шеф-Бургер", price: 26000, desc: "С куриным филе", img: "https://images.unsplash.com/photo-1594212844822-18d2b66e3724?q=80&w=200" },
            
            // Лаваши
            { id: 5, cat: "lavash", name: "Лаваш обычный", price: 25000, desc: "Классический лаваш", img: "https://images.unsplash.com/photo-1628840042765-356cda07504e?q=80&w=200" },
            { id: 6, cat: "lavash", name: "Лаваш сырный", price: 30000, desc: "Хрустящий лаваш с сыром", img: IMG_LAVASH },
            
            // Закуски
            { id: 7, cat: "snacks", name: "Картошка фри", price: 15000, desc: "Средняя порция с кетчупом", img: IMG_FRIES },
            { id: 8, cat: "snacks", name: "Наггетсы (6 шт)", price: 18000, desc: "С хрустящей корочкой", img: "https://images.unsplash.com/photo-1562967914-608f82629710?q=80&w=200" },
            
            // Напитки
            { id: 9, cat: "drinks", name: "Coca-Cola 0.5", price: 7000, desc: "Классика", img: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?q=80&w=200" },
            { id: 10, cat: "drinks", name: "Fuse Tea 0.5", price: 8000, desc: "Холодный чай с лимоном", img: IMG_FUSETEA },
            { id: 11, cat: "drinks", name: "Lipton 0.5", price: 8000, desc: "Зеленый чай", img: IMG_LIPTON },
            
            // Комбо
            { id: 12, cat: "combo", name: "Узбекский пир", price: 75000, desc: "Двойной Шеф-Бургер, фри, Кола 1л", img: "https://images.unsplash.com/photo-1610440042657-612c34d95e9f?q=80&w=200" },
            { id: 13, cat: "combo", name: "Друзья навсегда", price: 99000, oldPrice: 199000, desc: "3 Чизбургера, фри, наггетсы, Fuse Tea 1.5л", img: IMG_FRIENDS_ALWAYS }
        ];

        const categories = [
            { id: "burgers", title: "Бургеры" },
            { id: "lavash", title: "Лаваши" },
            { id: "snacks", title: "Закуски" },
            { id: "drinks", title: "Напитки" },
            { id: "combo", title: "Комбо" }
        ];

        let cart = {};
        let currentCategory = "burgers";
        let currentTotalValue = 0;
        let isSending = false;

        const navContainer = document.getElementById('nav-container');
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = `nav-btn ${cat.id === currentCategory ? 'active' : ''}`;
            btn.innerText = cat.title;
            btn.onclick = () => switchCategory(cat.id, btn);
            navContainer.appendChild(btn);
        });

        function switchCategory(catId, btnElement) {
            if (currentCategory === catId) return;
            currentCategory = catId;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            tg.HapticFeedback.selectionChanged();
            renderProducts();
        }

        const container = document.getElementById('menu-container');
        function renderProducts() {
            container.innerHTML = '';
            const filtered = products.filter(p => p.cat === currentCategory);
            
            filtered.forEach((p, index) => {
                const div = document.createElement('div');
                div.className = 'card';
                div.style.animationDelay = `${index * 0.08}s`; 
                
                let priceHTML = '';
                if (p.oldPrice) {
                    priceHTML = `
                        <div class="price-container">
                            <span class="old-price">${p.oldPrice.toLocaleString()} сум</span>
                            <span class="card-price discounted">${p.price.toLocaleString()} сум</span>
                        </div>
                    `;
                } else {
                    priceHTML = `
                        <div class="price-container">
                            <span class="card-price">${p.price.toLocaleString()} сум</span>
                        </div>
                    `;
                }
                
                div.innerHTML = `
                    <img src="${p.img}" class="card-img" alt="${p.name}">
                    <div class="card-info">
                        <span class="card-title">${p.name}</span>
                        <span class="card-desc">${p.desc}</span>
                        ${priceHTML}
                    </div>
                    <button class="add-btn" onclick="addToCart(${p.id}, '${p.name}', ${p.price})">+</button>
                `;
                container.appendChild(div);
            });
        }

        renderProducts();

        function addToCart(id, name, price) {
            if (isSending) return;
            if (!cart[id]) {
                cart[id] = { name: name, price: price, qty: 1 };
            } else {
                cart[id].qty++;
            }
            tg.HapticFeedback.impactOccurred('medium');
            updateTotal();
        }

        function updateTotal() {
            let targetTotal = 0;
            let count = 0;
            for (let id in cart) {
                targetTotal += cart[id].price * cart[id].qty;
                count += cart[id].qty;
            }
            
            animateValue("total", currentTotalValue, targetTotal, 400);
            currentTotalValue = targetTotal;

            const btn = document.getElementById('checkout-btn');
            if (count > 0) {
                btn.innerText = `Оформить (${count})`;
            } else {
                btn.innerText = 'Оформить';
            }
        }

        function animateValue(id, start, end, duration) {
            if (start === end) return;
            const obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const easeProgress = 1 - Math.pow(1 - progress, 4); 
                const current = Math.floor(easeProgress * (end - start) + start);
                obj.innerText = current.toLocaleString();
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        function sendOrder() {
            if (isSending) return;
            if (Object.keys(cart).length === 0) {
                tg.showAlert("Ваша корзина пуста! Добавьте что-нибудь 😉");
                return;
            }
            
            isSending = true;
            const btn = document.getElementById('checkout-btn');
            btn.innerText = 'Отправка...';
            btn.disabled = true;

            let itemsArray = [];
            for (let id in cart) {
                itemsArray.push({
                    name: cart[id].name,
                    qty: cart[id].qty,
                    price: cart[id].price
                });
            }

            try {
                tg.sendData(JSON.stringify({ action: "new_order", items: itemsArray }));
                setTimeout(() => {
                    tg.close();
                }, 500);
            } catch (e) {
                tg.showAlert("Ошибка JS: " + e.message);
                isSending = false;
                btn.disabled = false;
                btn.innerText = 'Оформить';
            }
        }
    </script>
</body>
</html>
