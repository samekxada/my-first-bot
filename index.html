<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Меню</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #FAFAFA;
            --surface: #FFFFFF;
            --text-main: #09090B;
            --text-muted: #71717A;
            --border: #E4E4E7;
            --accent: #2563EB; /* Строгий синий */
            --accent-hover: #1D4ED8;
            --red: #EF4444;
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0 16px 16px 16px;
            padding-bottom: calc(90px + var(--safe-bottom));
            /* Геометрический паттерн на фоне (еле заметная сетка) */
            background-image: 
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center top;
            background-attachment: fixed;
        }

        .header {
            padding: 24px 0 16px 0;
            background: var(--bg); /* Перекрываем сетку под шапкой */
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .nav-scroll {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding-bottom: 8px;
            scrollbar-width: none;
        }
        .nav-scroll::-webkit-scrollbar { display: none; }

        .nav-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn.active {
            background: var(--text-main);
            color: var(--surface);
            border-color: var(--text-main);
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            z-index: 10;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px; /* Строгие, почти прямые углы */
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.03); /* Жесткая тень */
            opacity: 0;
            transform: translateY(10px);
            animation: slideUp 0.3s ease forwards;
        }

        .card-img {
            width: 72px;
            height: 72px;
            border-radius: 2px;
            object-fit: cover;
            border: 1px solid var(--border);
        }

        .card-info { flex: 1; display: flex; flex-direction: column; }
        
        .card-title { 
            font-weight: 700; 
            font-size: 15px; 
            margin-bottom: 2px; 
            letter-spacing: -0.2px;
        }
        
        .card-desc { 
            font-size: 12px; 
            color: var(--text-muted); 
            margin-bottom: 8px; 
            line-height: 1.3; 
        }

        .price-row { display: flex; align-items: center; gap: 8px; }
        .price { font-weight: 700; font-size: 16px; color: var(--text-main); }
        
        .price.discount { color: var(--red); }
        .old-price { font-size: 12px; color: var(--text-muted); text-decoration: line-through; }

        .add-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            font-size: 20px;
            font-weight: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
            border-radius: 2px;
        }
        
        .add-btn:active { background: var(--text-main); color: var(--surface); }

        .bottom-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 16px 20px calc(16px + var(--safe-bottom)) 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .total-info { display: flex; flex-direction: column; }
        .total-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
        .total-val { font-weight: 800; font-size: 20px; letter-spacing: -0.5px; }

        .checkout-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 14px 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .checkout-btn:active { background: var(--accent-hover); }
        .checkout-btn:disabled { background: var(--border); color: var(--text-muted); }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="header">
        <h1>Меню</h1>
    </div>

    <div class="nav-scroll" id="nav-container"></div>
    <div class="menu-grid" id="menu-container"></div>

    <div class="bottom-bar">
        <div class="total-info">
            <span class="total-label">К оплате</span>
            <div class="total-val"><span id="total">0</span> сум</div>
        </div>
        <button class="checkout-btn" id="checkout-btn" onclick="sendOrder()">Оформить</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        // ФОТО
        const IMG_LAVASH = "lavash.jpg"; 
        const IMG_FRIES = "french_fries.jpg";
        const IMG_FUSETEA = "fusetea.jpg";
        const IMG_LIPTON = "lipton.jpg";

        const products = [
            { id: 1, cat: "burgers", name: "Классик Бургер", price: 24000, desc: "Сочная котлета, овощи, соус", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=200" },
            { id: 2, cat: "burgers", name: "Чизбургер", price: 28000, desc: "Двойной сыр чеддер", img: "https://images.unsplash.com/photo-1550547660-d9450f859349?q=80&w=200" },
            { id: 3, cat: "burgers", name: "Двойной Чизбургер", price: 38000, desc: "Для очень голодных", img: "https://images.unsplash.com/photo-1586816001966-79b736744398?q=80&w=200" },
            { id: 4, cat: "burgers", name: "Шеф-Бургер", price: 26000, desc: "Куриное филе, свежие овощи", img: "https://images.unsplash.com/photo-1594212844822-18d2b66e3724?q=80&w=200" },
            { id: 5, cat: "lavash", name: "Лаваш обычный", price: 25000, desc: "Классический", img: "https://images.unsplash.com/photo-1628840042765-356cda07504e?q=80&w=200" },
            { id: 6, cat: "lavash", name: "Лаваш сырный", price: 30000, desc: "С хрустящей сырной корочкой", img: IMG_LAVASH },
            { id: 7, cat: "snacks", name: "Картошка фри", price: 15000, desc: "Средняя порция", img: IMG_FRIES },
            { id: 8, cat: "snacks", name: "Наггетсы (6 шт)", price: 18000, desc: "С хрустящей корочкой", img: "https://images.unsplash.com/photo-1562967914-608f82629710?q=80&w=200" },
            { id: 9, cat: "drinks", name: "Coca-Cola 0.5", price: 7000, desc: "Классика", img: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?q=80&w=200" },
            { id: 10, cat: "drinks", name: "Fuse Tea 0.5", price: 8000, desc: "Холодный чай", img: IMG_FUSETEA },
            { id: 11, cat: "drinks", name: "Lipton 0.5", price: 8000, desc: "Зеленый чай", img: IMG_LIPTON },
            { id: 12, cat: "combo", name: "Узбекский пир", price: 75000, desc: "Двойной Шеф-Бургер, фри, Кола 1л", img: "https://images.unsplash.com/photo-1610440042657-612c34d95e9f?q=80&w=200" },
            { id: 13, cat: "combo", name: "Друзья навсегда", price: 99000, oldPrice: 199000, desc: "3 Чизбургера, фри, наггетсы, Fuse Tea 1.5л", img: "https://images.unsplash.com/photo-1594212844822-18d2b66e3724?q=80&w=200" }
        ];

        const categories = [
            { id: "burgers", title: "Бургеры" },
            { id: "lavash", title: "Лаваши" },
            { id: "snacks", title: "Закуски" },
            { id: "drinks", title: "Напитки" },
            { id: "combo", title: "Комбо" }
        ];

        let cart = {};
        let currentCategory = "burgers";
        let currentTotal = 0;
        let isSending = false;

        // Навигация
        const nav = document.getElementById('nav-container');
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = `nav-btn ${cat.id === currentCategory ? 'active' : ''}`;
            btn.innerText = cat.title;
            btn.onclick = () => {
                if(currentCategory === cat.id) return;
                currentCategory = cat.id;
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                render();
            };
            nav.appendChild(btn);
        });

        // Рендер товаров
        const container = document.getElementById('menu-container');
        function render() {
            container.innerHTML = '';
            const filtered = products.filter(p => p.cat === currentCategory);
            
            filtered.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = 'card';
                div.style.animationDelay = `${i * 0.05}s`; 
                
                let priceBlock = `<span class="price">${p.price.toLocaleString()} сум</span>`;
                if (p.oldPrice) {
                    priceBlock = `
                        <span class="old-price">${p.oldPrice.toLocaleString()}</span>
                        <span class="price discount">${p.price.toLocaleString()} сум</span>
                    `;
                }
                
                div.innerHTML = `
                    <img src="${p.img}" class="card-img">
                    <div class="card-info">
                        <span class="card-title">${p.name}</span>
                        <span class="card-desc">${p.desc}</span>
                        <div class="price-row">${priceBlock}</div>
                    </div>
                    <button class="add-btn" onclick="add(${p.id}, '${p.name}', ${p.price})">+</button>
                `;
                container.appendChild(div);
            });
        }
        render();

        // Логика корзины
        function add(id, name, price) {
            if(isSending) return;
            if(!cart[id]) cart[id] = { name, price, qty: 1 };
            else cart[id].qty++;
            
            tg.HapticFeedback.impactOccurred('light');
            update();
        }

        function update() {
            let target = 0, count = 0;
            for(let id in cart) {
                target += cart[id].price * cart[id].qty;
                count += cart[id].qty;
            }
            
            // Анимация
            if(currentTotal !== target) {
                let start = currentTotal;
                let end = target;
                let startTime = null;
                const step = (time) => {
                    if(!startTime) startTime = time;
                    let progress = Math.min((time - startTime) / 300, 1);
                    let val = Math.floor(progress * (end - start) + start);
                    document.getElementById('total').innerText = val.toLocaleString();
                    if(progress < 1) requestAnimationFrame(step);
                };
                requestAnimationFrame(step);
                currentTotal = target;
            }

            const btn = document.getElementById('checkout-btn');
            btn.innerText = count > 0 ? `Оформить (${count})` : 'Оформить';
        }

        // Отправка
        function sendOrder() {
            if(isSending) return;
            if(Object.keys(cart).length === 0) {
                tg.showAlert("Корзина пуста");
                return;
            }
            
            isSending = true;
            const btn = document.getElementById('checkout-btn');
            btn.innerText = 'Отправка...';
            btn.disabled = true;

            let arr = [];
            for(let id in cart) {
                arr.push({ name: cart[id].name, qty: cart[id].qty, price: cart[id].price });
            }

            tg.sendData(JSON.stringify({ action: "new_order", items: arr }));
            setTimeout(() => tg.close(), 500);
        }
    </script>
</body>
</html>
